[project]
name = "winds-mobi-provider"
description = "Python scripts that get the weather data from different providers and save it in a common format into mongodb."
version = "0.0.0"
authors = [{ name = "winds.mobi" }]
license = "AGPL-3.0-only"
requires-python = ">=3.13"

dependencies = [
    "apscheduler==3.11.2",
    "arrow==1.4.0",
    "cachetools==7.1.4",
    "furl==2.1.4",
    "lxml==6.1.1",
    "mysqlclient==2.2.8",
    "pint==0.25.3",
    "psycopg2==2.9.12",
    "pyaml==26.2.1",
    "pydantic==2.13.4",
    "pymongo==4.17.0",
    "pyproj==3.7.2",
    "redis==7.4.1",
    "requests[socks]==2.34.2",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "sentry-sdk==2.61.1",
    "tenacity==9.1.4",
    "timezonefinder==8.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.16",
    "scipy-stubs==1.17.1.5",
]

[tool.ruff]
line-length = 120
exclude = ["winds_mobi_provider/uwxutils.py"]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "SIM",
    "B",
    "UP",
    "I",
]
ignore = ["B023"]
